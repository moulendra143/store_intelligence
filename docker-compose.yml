version: "3.9"

services:
  # ─── FastAPI Intelligence API ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_intelligence_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # shared data directory (events JSONL, SQLite DB)
    environment:
      - DATABASE_URL=sqlite:////app/data/store_intelligence.db
      - EVENTS_FILE=/app/data/events.jsonl
      - POS_FILE=/app/data/pos_transactions.csv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

