

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: store-intelligence:latest
    container_name: store_intelligence_api

    ports:
      - "8000:8000"

    volumes:
      - store_intel_data:/app/data

    environment:
      DATABASE_URL: "sqlite:////app/data/store_intelligence.db"
      EVENTS_FILE: "/app/data/events.jsonl"
      POS_FILE: "/app/data/pos_transactions.csv"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  dashboard:
    image: store-intelligence:latest
    container_name: store_intelligence_dashboard

    ports:
      - "8501:8501"

    volumes:
      - store_intel_data:/app/data

    environment:
      API_URL: "http://api:8000"
      STORE_ID: "ST1008"

    command: >
      streamlit run dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

